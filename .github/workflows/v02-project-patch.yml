name: v02-project-patch

on:
  push:
    paths:
      - .v02-project-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2-ux-stability
      - name: Patch project identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.rs')
          text = path.read_text()

          dev_old = 'ProcessType::Development | ProcessType::Browser => process.snapshot.name.clone(),'
          dev_new = 'ProcessType::Development => development_project_label(process).unwrap_or_else(|| "-".into()),'
          generic_old = 'ProcessType::Ros2 | ProcessType::Generic => "-".into(),'
          generic_new = 'ProcessType::Ros2 | ProcessType::Browser | ProcessType::Generic => "-".into(),'
          marker = 'fn systemd_unit(process: &EnrichedProcess) -> Option<String> {'
          helper = "\n".join([
              'fn development_project_label(process: &EnrichedProcess) -> Option<String> {',
              '    let mut current = process.snapshot.cwd.as_deref()?;',
              '    for depth in 0..=8 {',
              '        match current.join(".git").try_exists() {',
              '            Ok(true) => {',
              '                return current',
              '                    .file_name()',
              '                    .map(|name| name.to_string_lossy().into_owned());',
              '            }',
              '            Ok(false) => {}',
              '            Err(_) => return None,',
              '        }',
              '',
              '        if depth == 8 {',
              '            break;',
              '        }',
              '        current = current.parent()?;',
              '    }',
              '    None',
              '}',
              '',
          ])

          for expected in (dev_old, generic_old, marker):
              if expected not in text:
                  raise SystemExit(f'expected token not found: {expected}')
          text = text.replace(dev_old, dev_new, 1)
          text = text.replace(generic_old, generic_new, 1)
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          cargo fmt -- src/app.rs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Xuan Yang"
          git config user.email "xuanyang.robotics@gmail.com"
          git add src/app.rs
          git commit -m "fix: infer development project roots"
          git push origin HEAD:feat/v0.2-ux-stability
