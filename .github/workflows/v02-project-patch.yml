name: v02-project-patch

on:
  push:
    paths:
      - .v02-project-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2-ux-stability
      - name: Patch project identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.rs')
          text = path.read_text()
          old = '''    match process.classification.process_type {
              ProcessType::Development | ProcessType::Browser => process.snapshot.name.clone(),
              ProcessType::Container => "container".into(),
              ProcessType::Systemd => systemd_unit(process).unwrap_or_else(|| "systemd".into()),
              ProcessType::Ros2 | ProcessType::Generic => "-".into(),
          }
          }

          fn systemd_unit(process: &EnrichedProcess) -> Option<String> {'''
          new = '''    match process.classification.process_type {
              ProcessType::Development => development_project_label(process).unwrap_or_else(|| "-".into()),
              ProcessType::Container => "container".into(),
              ProcessType::Systemd => systemd_unit(process).unwrap_or_else(|| "systemd".into()),
              ProcessType::Ros2 | ProcessType::Browser | ProcessType::Generic => "-".into(),
          }
          }

          fn development_project_label(process: &EnrichedProcess) -> Option<String> {
              let mut current = process.snapshot.cwd.as_deref()?;
              for depth in 0..=8 {
                  match current.join(".git").try_exists() {
                      Ok(true) => {
                          return current
                              .file_name()
                              .map(|name| name.to_string_lossy().into_owned());
                      }
                      Ok(false) => {}
                      Err(_) => return None,
                  }

                  if depth == 8 {
                      break;
                  }
                  current = current.parent()?;
              }
              None
          }

          fn systemd_unit(process: &EnrichedProcess) -> Option<String> {'''
          if old not in text:
              raise SystemExit('expected project_label block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt -- src/app.rs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Xuan Yang"
          git config user.email "xuanyang.robotics@gmail.com"
          git add src/app.rs
          git commit -m "fix: infer development project roots"
          git push origin HEAD:feat/v0.2-ux-stability
