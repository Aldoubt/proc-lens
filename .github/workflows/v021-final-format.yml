name: v021-final-format

on:
  push:
    branches:
      - feat/v0.2.1-provenance-refinement
    paths:
      - .v021-final-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.1-provenance-refinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format v0.2.1 final sources"
            git push origin HEAD:feat/v0.2.1-provenance-refinement
          fi
