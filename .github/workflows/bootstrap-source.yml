name: bootstrap-source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/part00
            head -c 5000 .bootstrap/part01
            cat .bootstrap/part02
            cat .bootstrap/part03
            cat .bootstrap/part04
            cat .bootstrap/part05
            cat .bootstrap/part06
            cat .bootstrap/part07
            cat .bootstrap/part08
          } > /tmp/proc-lens-v0.1-source.b64
          base64 -d /tmp/proc-lens-v0.1-source.b64 > /tmp/proc-lens-v0.1-source.tar.gz
          echo "47301bb87f461134b37272f67334914560cb58406f1e6a581ae8a232c4917ad6  /tmp/proc-lens-v0.1-source.tar.gz" | sha256sum -c -
          rm -rf /tmp/proc-lens-src
          mkdir -p /tmp/proc-lens-src
          tar -xzf /tmp/proc-lens-v0.1-source.tar.gz -C /tmp/proc-lens-src
          test -f /tmp/proc-lens-src/proc-lens/Cargo.toml
          test -f /tmp/proc-lens-src/proc-lens/src/main.rs
          test -f /tmp/proc-lens-src/proc-lens/scripts/verify.sh

      - name: Replace bootstrap tree with verified source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/proc-lens-src/proc-lens/ ./

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import proc-lens v0.1 source"
          git push origin HEAD:main
