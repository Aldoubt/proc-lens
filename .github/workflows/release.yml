name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      - name: Build and validate Debian package
        run: ./scripts/build-deb.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          deb="target/debian/proc-lens_${version}-1_amd64.deb"
          test -f "$deb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$deb" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$deb" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
