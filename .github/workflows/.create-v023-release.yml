name: verify-v023-release

on:
  push:
    branches:
      - feat/v0.2.3-ubuntu-packaging

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release metadata and downloaded Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.2.3 --json tagName,isDraft,isPrerelease,assets
          mkdir -p /tmp/proc-lens-release
          gh release download v0.2.3 \
            --pattern 'proc-lens_0.2.3-1_amd64.deb' \
            --dir /tmp/proc-lens-release
          ./scripts/validate-deb.sh \
            /tmp/proc-lens-release/proc-lens_0.2.3-1_amd64.deb
